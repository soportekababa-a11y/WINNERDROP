<svg width="800" height="800" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e0920"/>
      <stop offset="100%" stop-color="#08051a"/>
    </linearGradient>
    <linearGradient id="stroke" x1="18" y1="78" x2="82" y2="13" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5b21b6"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
    <radialGradient id="ambient" cx="78%" cy="16%" r="55%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lineglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="100" height="100" rx="24" fill="url(#bg)"/>
  <rect width="100" height="100" rx="24" fill="url(#ambient)"/>
  <rect width="100" height="100" rx="24" stroke="rgba(139,92,246,0.2)" stroke-width="1.5" fill="none"/>

  <path d="M18 78 L18 30 L50 57 L82 13 L82 78"
    stroke="url(#stroke)" stroke-width="9"
    stroke-linecap="round" stroke-linejoin="round"
    filter="url(#lineglow)"/>

  <circle cx="82" cy="13" r="14" fill="#d946ef" opacity="0.15" filter="url(#glow)"/>
  <circle cx="82" cy="13" r="6" fill="#e879f9"/>
  <circle cx="82" cy="13" r="3" fill="white" opacity="0.95"/>
</svg>
